server:
  port: 8080

ratelimiter:
  redis:
    host: localhost
    port: 6379

  # Rules are checked top to bottom and the FIRST match wins,
  # so specific paths go before general ones.
  rules:
    - name: hello
      path: /api/hello
      algorithm: token-bucket
      capacity: 5              # burst of 5...
      refill-per-second: 1     # ...then 1 request per second

    - name: search
      path: /api/search
      algorithm: sliding-window-counter
      limit: 5                 # 5 requests...
      window-seconds: 10       # ...per 10 seconds

    - name: orders
      path: /api/orders
      algorithm: leaky-bucket
      capacity: 3              # queue holds 3...
      leak-per-second: 1       # ...drains 1 per second

    - name: report
      path: /api/report
      algorithm: sliding-window-log
      limit: 2                 # strict: 2 requests...
      window-seconds: 15       # ...per 15 seconds

    - name: default            # everything else under /api/
      path: /api/**
      algorithm: token-bucket
      capacity: 20
      refill-per-second: 5
